<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four step workflow: Gather, Synthesize, Draft, Review and format">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DCAA5"/>
      <stop offset="100%" stop-color="#0F6E56"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AFA9EC"/>
      <stop offset="100%" stop-color="#534AB7"/>
    </linearGradient>
    <linearGradient id="g-coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0997B"/>
      <stop offset="100%" stop-color="#993C1D"/>
    </linearGradient>
    <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#97C459"/>
      <stop offset="100%" stop-color="#3B6D11"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="260" fill="#ffffff"/>

  <!-- Step 1: Gather -->
  <g>
    <rect x="30" y="70" width="180" height="120" rx="16" fill="url(#g-teal)"/>
    <circle cx="120" cy="70" r="18" fill="#085041"/>
    <text x="120" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">1</text>
    <text x="120" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">GATHER</text>
    <text x="120" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E1F5EE">Raw notes +</text>
    <text x="120" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E1F5EE">source list</text>
  </g>

  <line x1="212" y1="130" x2="248" y2="130" stroke="#5F5E5A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Synthesize -->
  <g>
    <rect x="250" y="70" width="180" height="120" rx="16" fill="url(#g-purple)"/>
    <circle cx="340" cy="70" r="18" fill="#3C3489"/>
    <text x="340" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">2</text>
    <text x="340" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">SYNTHESIZE</text>
    <text x="340" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#EEEDFE">Themes, conflicts,</text>
    <text x="340" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#EEEDFE">weak sourcing flagged</text>
  </g>

  <line x1="432" y1="130" x2="468" y2="130" stroke="#5F5E5A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Draft -->
  <g>
    <rect x="470" y="70" width="180" height="120" rx="16" fill="url(#g-coral)"/>
    <circle cx="560" cy="70" r="18" fill="#712B13"/>
    <text x="560" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">3</text>
    <text x="560" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">DRAFT</text>
    <text x="560" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FAECE7">Short brief in my</text>
    <text x="560" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FAECE7">voice (Voice Card)</text>
  </g>

  <line x1="652" y1="130" x2="688" y2="130" stroke="#5F5E5A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Review & Format -->
  <g>
    <rect x="690" y="70" width="180" height="120" rx="16" fill="url(#g-green)"/>
    <circle cx="780" cy="70" r="18" fill="#27500A"/>
    <text x="780" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">4</text>
    <text x="780" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">REVIEW &amp;</text>
    <text x="780" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">FORMAT</text>
    <text x="780" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#EAF3DE">Claims checked,</text>
    <text x="780" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#EAF3DE">ready to post</text>
  </g>

  <text x="450" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5F5E5A">Each arrow is a real handoff — the output of one step is pasted as the input to the next. Nothing is skipped or merged.</text>
</svg>
